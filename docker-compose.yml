# 本地/演示环境的一体化编排:MySQL + 后端
#
# 用法:
#   1. cp .env.example .env 并填写密钥
#   2. docker compose up -d --build
#   3. curl http://localhost:8080/api/health
#
# 首次启动还没有管理员账号时,可在 backend 服务上临时加:
#   ADMIN_INIT_ENABLED=true ADMIN_INIT_USERNAME=admin ADMIN_INIT_PASSWORD=xxxx
# 创建成功后请移除这些变量再重启。

services:
  mysql:
    image: mysql:8.0
    container_name: diy-figure-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-qaz123456}
      MYSQL_DATABASE: ${DB_NAME:-diy_figure}
      TZ: Asia/Shanghai
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD:-qaz123456}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: diy-figure-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # 本地/演示默认 dev,允许模拟支付走完闭环;上线请设 SPRING_PROFILES_ACTIVE=prod
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-diy_figure}?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-qaz123456}
      JWT_SECRET: ${JWT_SECRET:-diy-figure-jwt-secret-key-please-change-in-production-2024}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      DIY_LOCAL_STORAGE_DIR: /app/data/uploads
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MESHY_API_KEY: ${MESHY_API_KEY:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_BUCKET_NAME: ${OSS_BUCKET_NAME:-diy-figure}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - backend-uploads:/app/data/uploads

volumes:
  mysql-data:
  backend-uploads:
