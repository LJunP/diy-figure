# 生产环境配置
#
# 启动方式示例:
#   SPRING_PROFILES_ACTIVE=prod \
#   SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/diy_figure?... \
#   DB_USERNAME=xxx DB_PASSWORD=xxx \
#   JWT_SECRET=<至少 32 字节的随机串> \
#   CORS_ALLOWED_ORIGINS=https://your-domain.com \
#   java -jar diy-figure-backend.jar
#
# 所有敏感值都通过环境变量注入,不要写进本文件。

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      # 生产环境禁止自动改表:表结构由迁移脚本维护,启动时只做校验
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    clean-disabled: true
    validate-on-migrate: true
    baseline-on-migrate: false

# JWT 密钥必须从环境变量注入,不提供默认值(缺配置直接启动失败,避免用弱密钥上线)
jwt:
  secret: ${JWT_SECRET}
  expiration: 604800000

# 生产环境关闭模拟支付:任何情况下都不允许用假支付改动订单状态
payment:
  mock-enabled: false

# 生产环境必须显式指定允许的前端域名
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    com.diyfigure: info
    org.hibernate.SQL: warn
    org.hibernate.type.descriptor.sql.BasicBinder: warn
