# DIY Figure 反向代理参考配置
#
# 关键点:SSE 对话(/api/canvases/*/chat)绝不能被 proxy_buffering 吃成一次性返回。
# 把本文件放到 /etc/nginx/conf.d/diy-figure.conf 后 nginx -t && nginx -s reload。
# TLS 证书、域名需要业务方提供,这里用 HTTP 80 演示路径结构。

upstream diy_backend {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    root /var/www/diy-figure/dist;
    index index.html;

    # 前端 SPA:所有非文件路径回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # SSE 必须单独 location,关掉缓冲,拉长超时
    location ~ ^/api/canvases/[^/]+/chat$ {
        proxy_pass http://diy_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    location /api/ {
        proxy_pass http://diy_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        client_max_body_size 50m;
        proxy_read_timeout 60s;
    }

    # 本地降级存储的参考图
    location /api/uploads/ {
        proxy_pass http://diy_backend;
        proxy_set_header Host $host;
    }
}
